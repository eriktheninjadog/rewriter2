system:
  vocabulary_file: "vocabulary_10000.txt"
  model: "Qwen/Qwen-7B-Chat"
  temperature: 0.7
  max_tokens: 2000

oov_detection:
  keep_numbers: true
  keep_dates: true
  keep_proper_nouns: true
  keep_function_words: true
  min_word_length_to_replace: 2

synonym_selection:
  similarity_threshold: 0.65
  max_candidates_per_word: 5
  use_multiple_sources: true

llm:
  rewrite_prompt_template: "templates/rewrite_prompt.txt"
  validation_prompt_template: "templates/validate_prompt.txt"
  max_retries: 3
